[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indykite-sdk-python"
description = "IndyKite Python SDK - REST clients for the IndyKite platform APIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
version = "2.1.1"
authors = [
    { name = "IndyKite", email = "develop@indykite.com" },
]
keywords = ["indykite", "sdk", "knowledge-graph", "authorization", "authzen", "kbac"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    # Only needed for legacy JWK-only credential files (self-signed ES256 JWTs).
    "joserfc>=1.0",
]

[project.urls]
Homepage = "https://github.com/indykite/indykite-sdk-python"
Documentation = "https://indykite.github.io/indykite-sdk-python/"
"Developer Guides" = "https://developer.indykite.com"
Changelog = "https://github.com/indykite/indykite-sdk-python/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["indykite_sdk*"]

[tool.setuptools.package-data]
indykite_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit a live IndyKite environment (deselected by default)",
]
addopts = "-m 'not integration'"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["indykite_sdk"]
omit = [
    "tests/*",
    "tmp/*",
]

#
# 'ruff' - the primary linter, the rest are left as a reference and potential manual cross-verification
# https://github.com/astral-sh/ruff
[tool.ruff]
target-version = 'py314'
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-annotations
    "ANN",
]
ignore = [
    "ANN401", # Any is deliberate in dict-payload passthroughs and generic plumbing
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"examples/**" = ["ANN"]

[tool.ruff.format]
quote-style = 'double'
[tool.ruff.lint.flake8-quotes]
inline-quotes = 'double'

#
# 'bandit' config section
# https://bandit.readthedocs.io/en/latest/config.html
#
[tool.bandit]
exclude_dirs = ['tests']

#
# NOTE: flake8 doesn't use this TOML by default, requires 'Flake8-pyproject' for that
[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203", # whitespace before ':'
]

#
# Pylint config section
#
[tool.pylint.main]
fail-on = "F"
fail-under = 9.0
jobs = 0
persistent = "yes"
py-version = 3.14
suggestion-mode = "yes"
unsafe-load-any-extension = "no"

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
# SDK client methods mirror REST operations: many optional keyword-only
# parameters and one public method per endpoint are deliberate.
max-args = 14
max-positional-arguments = 8
max-public-methods = 90
min-public-methods = 1

[tool.pylint."messages control"]
disable = [
    "duplicate-code", # sync and async clients mirror each other by design
    "import-outside-toplevel", # lazy signing imports keep joserfc out of non-signing paths
]
variable-rgx = '^_?[a-zA-Z][_a-zA-Z\d]*$'
argument-rgx = '^[a-zA-Z][_a-z\d]*$'
attr-rgx = '^_?[a-zA-Z][_a-z\d]*$'
method-rgx = '^_{0,2}[a-z][_a-z\d]*$'

#
# 'black' config section (manual stage only; ruff-format is the primary formatter)
#
[tool.black]
line-length = 120
target-version = ['py313']
diff = 1
color = 1
