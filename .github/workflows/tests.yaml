---
name: Tests

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: ["dev", "develop", "main", "master"]
    paths:
      - '**.py'
      - Pipfile*
      - pyproject.toml
      - .github/workflows/tests.yaml
  push:
    branches: ["dev", "develop", "main", "master"]
    paths:
      - '**.py'
      - Pipfile*
      - pyproject.toml
      - .github/workflows/tests.yaml
  schedule:
    # Nightly integration run against the live environment.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/python3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 - https://github.com/actions/setup-python/releases
        with:
          python-version: "3.14"
          cache: "pipenv"

      - name: setup/pipenv
        run: |
          pipx install pipenv
          pipenv install --dev

      - name: Run unit tests
        run: pipenv run pytest --cov . --cov-report xml

      - name: codecov/upload-coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0 - https://github.com/codecov/codecov-action/releases
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: coverage.xml

  integration:
    name: Integration tests
    # Push to protected branches, nightly cron, or manual dispatch - never fork PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      INDYKITE_APPLICATION_CREDENTIALS: ${{ secrets.INDYKITE_APPLICATION_CREDENTIALS }}
      INDYKITE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.INDYKITE_SERVICE_ACCOUNT_CREDENTIALS }}
      INDYKITE_BASE_URL: ${{ vars.INDYKITE_BASE_URL }}
      INDYKITE_TEST_ORGANIZATION_ID: ${{ secrets.INDYKITE_TEST_ORGANIZATION_ID }}
      INDYKITE_TEST_PROJECT_ID: ${{ secrets.INDYKITE_TEST_PROJECT_ID }}
      INDYKITE_TEST_KNOWLEDGE_QUERY_ID: ${{ secrets.INDYKITE_TEST_KNOWLEDGE_QUERY_ID }}
      INDYKITE_TEST_ENTITY_MATCHING_PIPELINE_ID: ${{ secrets.INDYKITE_TEST_ENTITY_MATCHING_PIPELINE_ID }}
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/python3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 - https://github.com/actions/setup-python/releases
        with:
          python-version: "3.14"
          cache: "pipenv"

      - name: setup/pipenv
        run: |
          pipx install pipenv
          pipenv install --dev

      - name: Run integration tests
        # The integration suite skips itself when credentials are not configured.
        run: pipenv run pytest -m integration
